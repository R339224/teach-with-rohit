<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products | Teach With Rohit</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #07111f;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 40px;
            color: #00eaff;
        }

        .product {
            width: 300px;
            max-width: 85%;
            margin: 40px auto;
            padding: 25px;
            background: #101d30;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(0, 234, 255, 0.25);
        }

        .product h2 {
            margin-bottom: 15px;
        }

        .product p {
            color: #c8d4e3;
            line-height: 1.5;
        }

        .buy-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 13px 25px;
            background: #ff9900;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .buy-btn:hover {
            background: #ffb52e;
        }

        .note {
            margin: 25px auto;
            max-width: 500px;
            color: #8fa3ba;
            font-size: 13px;
            padding: 0 20px;
        }
    </style>
</head>

<body>

    <h1>🔥 Recommended Products</h1>

    <div class="product">

        <h2 id="productName">Recommended Product</h2>

        <p>
            Check price and details of this product on Amazon.
        </p>

        <a id="buyButton" class="buy-btn" href="#" target="_blank" rel="nofollow sponsored noopener">
            🛒 Buy on Amazon
        </a>

    </div>

    <div class="note">
        As an Amazon Associate, I earn from qualifying purchases.
    </div>


    <script>

        const params = new URLSearchParams(window.location.search);

        const productName = params.get("name");
        const amazonLink = params.get("link");


        if (productName) {
            document.getElementById("productName").textContent =
                productName;
        }


        if (amazonLink) {

            let decodedLink;

            try {
                decodedLink = decodeURIComponent(amazonLink);
            } catch (error) {
                decodedLink = amazonLink;
            }

            document.getElementById("buyButton").href =
                decodedLink;

        } else {

            document.getElementById("buyButton").href =
                "https://www.amazon.in/";

        }

    </script>

</body>

</html>
