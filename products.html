<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Teach With Rohit</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #07111f;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 40px;
            color: #00eaff;
        }

        .product {
            width: 300px;
            margin: 40px auto;
            padding: 25px;
            background: #101d30;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(0, 234, 255, 0.25);
        }

        .product h2 {
            margin-bottom: 15px;
        }

        .buy-btn {
            display: inline-block;
            padding: 13px 25px;
            background: #ff9900;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .buy-btn:hover {
            background: #ffb52e;
        }
    </style>
</head>

<body>

    <h1>🔥 Recommended Products</h1>

    <div class="product">
        <h2><h2>Zebronics Wireless Keyboard</h2></h2>
        <p>Check price and details on Amazon</p>

        <a class="buy-btn" href="https://link.amazon/B0i7McJLf" target="_blank" rel="nofollow sponsored">
            🛒 Buy on Amazon
        </a>
    </div>

</body>

</html>
